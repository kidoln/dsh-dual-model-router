<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- dsh-dual-model-router icon: a strong chip (P) planning for a fast chip (A),
       connected by a route that splits into two execution lanes. Original artwork. -->
  <defs>
    <linearGradient id="dmr-strong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bfe"/>
      <stop offset="1" stop-color="#2b4bd7"/>
    </linearGradient>
    <linearGradient id="dmr-fast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3eaf7c"/>
      <stop offset="1" stop-color="#1f8a5c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="8" width="24" height="20" rx="6" fill="url(#dmr-strong)"/>
  <text x="16" y="22.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
  <rect x="36" y="8" width="24" height="20" rx="6" fill="url(#dmr-fast)"/>
  <text x="48" y="22.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="4" y="40" width="24" height="16" rx="5" fill="url(#dmr-fast)" opacity="0.85"/>
  <rect x="36" y="40" width="24" height="16" rx="5" fill="url(#dmr-fast)" opacity="0.85"/>
  <path d="M16 30 v6 h32 v2" fill="none" stroke="#4f6bfe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 32 v6 M16 36 v2 h-0 h0 z" fill="none"/>
  <path d="M16 30 v8" fill="none" stroke="#3eaf7c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 28 v12" fill="none" stroke="#3eaf7c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12.5 34.5 l3.5 4 3.5 -4" fill="none" stroke="#3eaf7c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44.5 36.5 l3.5 4 3.5 -4" fill="none" stroke="#3eaf7c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
